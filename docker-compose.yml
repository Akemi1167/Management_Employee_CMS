version: '3.8'

services:
  web:
    image: management_employee_cms_web:latest
    build: .
    ports:
      - "3092:80" # CMS Web: host 3092 → Nginx container 80
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
    networks:
      - emp_cms_network

networks:
  emp_cms_network:
    external: true # Kết nối chung network với API (nếu cần thiết sau này, hiện tại proxy qua domain ngoài)
